name: Daily digest

# Every morning: read RBI notifications published since the last run, commit the updated digest,
# and publish the site to GitHub Pages. Needs the repository secret GEMINI_API_KEY; without it the
# digest is built from the rules alone and those notifications are re-read once the key is set.
on:
  schedule:
    - cron: "30 3 * * *"        # 09:00 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Read new notifications
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MAX_RETRIES: "2"
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then NOMODEL=--no-model; fi
          python -m radar.digest --new $NOMODEL
          if [ -z "$NOMODEL" ]; then python -m radar.digest --retry; fi
      - name: Commit the digest
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if [ -d data/answers ]; then git add data/answers; fi
          if git diff --cached --quiet; then echo "no new notifications"; exit 0; fi
          git commit -m "Digest: RBI checked $(date -u +%Y-%m-%d)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
