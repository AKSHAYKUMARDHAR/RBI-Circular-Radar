name: Digest

# Every 10 minutes: look for RBI notifications published since the last one read. Only when something
# new arrives does it read it (rules + Gemini), commit the digest and republish the site; a check with
# nothing new makes no model request, no commit and no deployment. Needs the repository secret
# GEMINI_API_KEY; without it new notices are published from the rules alone and re-read once it's set.
on:
  schedule:
    - cron: "*/10 * * * *"      # GitHub may start scheduled runs a few minutes late
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "!site/data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.read.outputs.changed == 'true' || github.event_name != 'schedule' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Look for new notifications
        id: read
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MAX_RETRIES: "2"
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then NOMODEL=--no-model; fi
          python -m radar.digest --new $NOMODEL
          if [ -z "$NOMODEL" ]; then python -m radar.digest --retry; fi
      - name: Commit the digest
        if: steps.read.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if [ -d data/answers ]; then git add data/answers; fi
          git commit -m "Digest: new RBI notifications read $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
      - uses: actions/configure-pages@v5
        if: steps.read.outputs.changed == 'true' || github.event_name != 'schedule'
      - uses: actions/upload-pages-artifact@v3
        if: steps.read.outputs.changed == 'true' || github.event_name != 'schedule'
        with:
          path: site

  deploy:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
